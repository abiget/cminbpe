<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="480" fill="#ffffff"/>

  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a2e">BPE Merge Process — encoding "Hello"</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Each step merges the highest-priority adjacent pair present into a single new token</text>

  <!-- ROW 0: raw bytes -->
  <text x="40" y="102" font-size="12" fill="#9ca3af">step 0 — raw bytes</text>
  <g font-size="15" font-weight="600">
    <g transform="translate(40,110)">
      <rect width="70" height="46" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
      <text x="35" y="20" text-anchor="middle" fill="#1a1a2e">H</text>
      <text x="35" y="37" text-anchor="middle" font-size="10" font-weight="400" fill="#6366f1">72</text>
    </g>
    <g transform="translate(120,110)">
      <rect width="70" height="46" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
      <text x="35" y="20" text-anchor="middle" fill="#1a1a2e">e</text>
      <text x="35" y="37" text-anchor="middle" font-size="10" font-weight="400" fill="#6366f1">101</text>
    </g>
    <g transform="translate(200,110)">
      <rect width="70" height="46" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
      <text x="35" y="20" text-anchor="middle" fill="#1a1a2e">l</text>
      <text x="35" y="37" text-anchor="middle" font-size="10" font-weight="400" fill="#6366f1">108</text>
    </g>
    <g transform="translate(280,110)">
      <rect width="70" height="46" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
      <text x="35" y="20" text-anchor="middle" fill="#1a1a2e">l</text>
      <text x="35" y="37" text-anchor="middle" font-size="10" font-weight="400" fill="#6366f1">108</text>
    </g>
    <g transform="translate(360,110)">
      <rect width="70" height="46" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
      <text x="35" y="20" text-anchor="middle" fill="#1a1a2e">o</text>
      <text x="35" y="37" text-anchor="middle" font-size="10" font-weight="400" fill="#6366f1">111</text>
    </g>
  </g>
  <!-- highlight pair (H,e) merging -->
  <rect x="36" y="106" width="158" height="54" rx="10" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="115" y="178" text-anchor="middle" font-size="11" fill="#f97316" font-weight="600">merge (72,101) → 256</text>
  <path d="M115,182 L115,206" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ROW 1: after He merge -->
  <text x="40" y="228" font-size="12" fill="#9ca3af">step 1</text>
  <g font-size="15" font-weight="600">
    <g transform="translate(40,236)">
      <rect width="70" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="35" y="20" text-anchor="middle" fill="#1a1a2e">He</text>
      <text x="35" y="37" text-anchor="middle" font-size="10" font-weight="400" fill="#16a34a">256</text>
    </g>
    <g transform="translate(120,236)">
      <rect width="70" height="46" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
      <text x="35" y="20" text-anchor="middle" fill="#1a1a2e">l</text>
      <text x="35" y="37" text-anchor="middle" font-size="10" font-weight="400" fill="#6366f1">108</text>
    </g>
    <g transform="translate(200,236)">
      <rect width="70" height="46" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
      <text x="35" y="20" text-anchor="middle" fill="#1a1a2e">l</text>
      <text x="35" y="37" text-anchor="middle" font-size="10" font-weight="400" fill="#6366f1">108</text>
    </g>
    <g transform="translate(280,236)">
      <rect width="70" height="46" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
      <text x="35" y="20" text-anchor="middle" fill="#1a1a2e">o</text>
      <text x="35" y="37" text-anchor="middle" font-size="10" font-weight="400" fill="#6366f1">111</text>
    </g>
  </g>
  <rect x="116" y="232" width="158" height="54" rx="10" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="195" y="304" text-anchor="middle" font-size="11" fill="#f97316" font-weight="600">merge (108,108) → 257</text>
  <path d="M195,308 L195,332" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ROW 2: after ll merge -->
  <text x="40" y="354" font-size="12" fill="#9ca3af">step 2</text>
  <g font-size="15" font-weight="600">
    <g transform="translate(40,362)">
      <rect width="70" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="35" y="20" text-anchor="middle" fill="#1a1a2e">He</text>
      <text x="35" y="37" text-anchor="middle" font-size="10" font-weight="400" fill="#16a34a">256</text>
    </g>
    <g transform="translate(120,362)">
      <rect width="70" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="35" y="20" text-anchor="middle" fill="#1a1a2e">ll</text>
      <text x="35" y="37" text-anchor="middle" font-size="10" font-weight="400" fill="#16a34a">257</text>
    </g>
    <g transform="translate(200,362)">
      <rect width="70" height="46" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
      <text x="35" y="20" text-anchor="middle" fill="#1a1a2e">o</text>
      <text x="35" y="37" text-anchor="middle" font-size="10" font-weight="400" fill="#6366f1">111</text>
    </g>
  </g>
  <rect x="36" y="358" width="158" height="54" rx="10" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="115" y="430" text-anchor="middle" font-size="11" fill="#f97316" font-weight="600">merge (256,257) → 258</text>
  <path d="M115,434 L115,442" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ROW 3: final -->
  <text x="450" y="354" font-size="12" fill="#9ca3af">final — no more mergeable pairs</text>
  <g font-size="15" font-weight="600">
    <g transform="translate(450,362)">
      <rect width="90" height="46" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
      <text x="45" y="20" text-anchor="middle" fill="#1a1a2e">Hell</text>
      <text x="45" y="37" text-anchor="middle" font-size="10" font-weight="400" fill="#d97706">258</text>
    </g>
    <g transform="translate(550,362)">
      <rect width="70" height="46" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
      <text x="35" y="20" text-anchor="middle" fill="#1a1a2e">o</text>
      <text x="35" y="37" text-anchor="middle" font-size="10" font-weight="400" fill="#6366f1">111</text>
    </g>
  </g>
  <path d="M195,385 L440,385" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

  <text x="450" y="440" text-anchor="middle" font-size="13" fill="#374151" font-weight="600">encode("Hello") = [258, 111]</text>
  <text x="450" y="460" text-anchor="middle" font-size="11" fill="#9ca3af">merges = {(72,101): 256, (108,108): 257, (256,257): 258}</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
